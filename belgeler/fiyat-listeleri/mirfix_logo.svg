<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
  <rect width="1000" height="360" fill="white"/>

  <!-- mir -->
  <text x="140" y="238" font-family="DejaVu Sans" font-weight="bold" font-size="195" fill="#1d1d1b" letter-spacing="-6">mir</text>
  <!-- alt yazi -->
  <text x="152" y="300" font-family="DejaVu Sans" font-size="43" font-weight="500" fill="#1d1d1b">Yapi Kimyasallar&#305;</text>

  <!-- fix -->
  <text x="530" y="238" font-family="DejaVu Sans" font-weight="bold" font-style="italic" font-size="195" fill="#e2231a" letter-spacing="-4">fix</text>

  <!-- swoosh -->
  <path d="M 520 268 C 680 322, 860 250, 962 62 C 900 245, 720 310, 522 292 Z" fill="#e2231a"/>

  <!-- ladybug -->
  <g transform="translate(100,84) rotate(-28)">
    <!-- antennae -->
    <path d="M -10 -62 C -18 -80, -30 -88, -44 -90" stroke="#1d1d1b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 10 -62 C 14 -82, 24 -94, 38 -100" stroke="#1d1d1b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="0" cy="-50" r="18" fill="#1d1d1b"/>
    <!-- body -->
    <ellipse cx="0" cy="6" rx="44" ry="56" fill="#e2231a" stroke="#1d1d1b" stroke-width="6"/>
    <!-- center split -->
    <line x1="0" y1="-48" x2="0" y2="62" stroke="#1d1d1b" stroke-width="5"/>
    <!-- spots -->
    <circle cx="-19" cy="-18" r="10" fill="#1d1d1b"/>
    <circle cx="19" cy="-18" r="10" fill="#1d1d1b"/>
    <circle cx="-24" cy="16" r="9" fill="#1d1d1b"/>
    <circle cx="24" cy="16" r="9" fill="#1d1d1b"/>
    <circle cx="-13" cy="44" r="8" fill="#1d1d1b"/>
    <circle cx="13" cy="44" r="8" fill="#1d1d1b"/>
  </g>
</svg>